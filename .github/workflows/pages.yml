name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Every Monday at 03:17 UTC: pull new HN mentions, enrich papers, commit data/, and deploy Pages
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Fetch latest HN mentions and paper metadata before deploying"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python pipeline/test_normalize.py
          python -m unittest discover -s pipeline/tests

      - name: Refresh HN mentions and paper metadata
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        env:
          HP_BASE_URL: "https://agilealpha1.github.io/HackerPapers/"
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bash deploy/cloud_update.sh

      - name: Commit updated data to main
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): automated weekly HN and paper refresh"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cache paper embeddings
        uses: actions/cache@v4
        with:
          path: |
            data/meta/embeddings.npy
            data/meta/embedding_ids.json
            ~/.cache/huggingface
          key: embeddings-${{ hashFiles('data/meta/arxiv.jsonl', 'pipeline/embed.py') }}
          restore-keys: |
            embeddings-

      - name: Compute embeddings
        run: |
          python pipeline/embed.py || echo "Embeddings unavailable; falling back to TF-IDF"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site data and static site
        env:
          HP_BASE_URL: "https://agilealpha1.github.io/HackerPapers/"
        run: |
          python pipeline/build_site_data.py
          python pipeline/export_open_data.py
          python pipeline/make_static.py --out site_dist
          touch site_dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
