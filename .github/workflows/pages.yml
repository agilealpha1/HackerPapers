name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python pipeline/test_normalize.py
          python -m unittest discover -s pipeline/tests

      - name: Cache paper embeddings
        uses: actions/cache@v4
        with:
          path: |
            data/meta/embeddings.npy
            data/meta/embedding_ids.json
            ~/.cache/huggingface
          key: embeddings-${{ hashFiles('data/meta/arxiv.jsonl', 'pipeline/embed.py') }}
          restore-keys: |
            embeddings-

      - name: Compute embeddings
        run: |
          python pipeline/embed.py || echo "Embeddings unavailable; falling back to TF-IDF"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site data and static site
        env:
          HP_BASE_URL: "https://agilealpha1.github.io/HackerPapers/"
        run: |
          python pipeline/build_site_data.py
          python pipeline/export_open_data.py
          python pipeline/make_static.py --out site_dist
          touch site_dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
